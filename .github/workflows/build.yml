name: Build CloudStream Plugins

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # Ensure a Gradle wrapper exists so CI and local runs are consistent
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle wrapper (Gradle 8.4)"
            gradle wrapper --gradle-version 8.4
          fi

      # 1. Clean the project so no old classes remain
      - name: Clean project
        run: ./gradlew clean --no-daemon --stacktrace

      # 2. Clear Gradle cache directory
      - name: Clear Gradle cache
        run: |
          rm -rf ~/.gradle/caches/* || true
          rm -rf ~/.gradle/wrapper/* || true

      # 3. Build the plugins (use wrapper and enable stacktrace/info for diagnostics)
      - name: Build plugins
        run: ./gradlew make makePluginsJson --no-daemon --stacktrace --info

      # 4. Collect the output files
      - name: Collect build output
        run: |
          mkdir -p release
          find . -name "*.cs3" -not -path "./release/*" -exec cp {} release/ \;
          cp build/plugins.json release/plugins.json || true
          cat > release/manifest.json <<EOF
          {
            "name": "Codegeasse Repo",
            "description": "Anime4i CloudStream extensions",
            "manifestVersion": 1,
            "pluginLists": ["https://raw.githubusercontent.com/${{ github.repository }}/builds/plugins.json"]
          }
          EOF

      # 5. Push to the `builds` branch
      - name: Push to builds branch
        run: |
          cd release
          git init
          git checkout -b builds
          git add .
          git -c user.name='github-actions' -c user.email='github-actions@github.com' commit -m "Build ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push origin builds --force
