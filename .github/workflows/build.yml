name: Build CloudStream Plugins

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build plugins
        # Removed --info and --stacktrace to prevent log spam
        run: gradle make makePluginsJson

      - name: Collect build output
        run: |
          mkdir -p release
          find . -name "*.cs3" -not -path "./release/*" -exec cp {} release/ \;
          cp build/plugins.json release/plugins.json || true
          cat > release/manifest.json <<EOF
          {
            "name": "Codegeasse Repo",
            "description": "Anime4i CloudStream extensions",
            "manifestVersion": 1,
            "pluginLists": ["https://raw.githubusercontent.com/${{ github.repository }}/builds/repo.json"]
          }
          EOF

      - name: Push to builds branch
        run: |
          cd release
          git init
          git checkout -b builds
          git add .
          
          # Only commit and push when there are actual changes
          if git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit"
          else
            git -c user.name='github-actions' -c user.email='github-actions@github.com' commit -m "Build ${{ github.sha }}"
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
            git push origin builds --force
          fi
